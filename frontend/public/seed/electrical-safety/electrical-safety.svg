  </text>
  <text x="60" y="760" font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="16" letter-spacing="2.6" fill="#FFFFFF" opacity="0.32">
    PLACEHOLDER ARTWORK
  </text>
