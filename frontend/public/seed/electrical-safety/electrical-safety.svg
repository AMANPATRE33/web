      <path d="M340,120 L200,320 h90 l-40,160 L390,270 h-90 Z"/>
    </g>
  </g>
  <text x="60" y="730" font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="40" letter-spacing="3" fill="#C8102E" opacity="0.85">
