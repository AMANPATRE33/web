<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800"
     viewBox="0 0 1200 800" role="img" aria-label="Electrical Safety">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1D21"/>
      <stop offset="100%" stop-color="#0E0F12"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g transform="translate(450 250) scale(1.2)">
    <rect x="20" y="20" width="280" height="280" rx="6"
          fill="#C8102E" stroke="#8C0A20" stroke-width="8"/>
    <g transform="translate(0 20)" fill="none" stroke="#FFFFFF"
