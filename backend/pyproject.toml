[project]
name = "storefront-backend"
version = "1.0.0"
description = "Production ecommerce API - FastAPI + SQLAlchemy + Supabase"
requires-python = ">=3.12,<3.14"
dependencies = [
    # --- web ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # --- config / validation ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    # --- database ---
    "SQLAlchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
    # --- auth ---
    "PyJWT[crypto]>=2.9",
    "supabase>=2.10",
    # --- http client (Razorpay, email providers, Supabase admin) ---
    "httpx>=0.27",
    "tenacity>=9.0",
    # --- infrastructure ---
    "redis>=5.2",
    "arq>=0.26",
    "structlog>=24.4",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: pure logic, no database",
    "integration: requires a PostgreSQL database",
    "e2e: end-to-end flows",
]
filterwarnings = [
    # An un-awaited coroutine is a *silent* no-op: in SQLAlchemy >= 2.1
    # `AsyncSession.delete()` and `.merge()` are coroutines, so calling them
    # without `await` produces no error and no effect - the flush just does
    # nothing. That failure mode hides until an assertion mysteriously reads
    # stale data, so it is promoted to an error here.
    "error:coroutine .* was never awaited:RuntimeWarning",
    "error::DeprecationWarning:app.*",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "C4", "DTZ", "RUF"]
ignore = [
    "S101",  # assert is used intentionally in tests and internal invariants
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Test code legitimately contains credentials for the throwaway local database
# and calls subprocess with fixed, non-interpolated argument vectors.
"tests/*" = ["S105", "S106", "S311", "S603", "S607"]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = false
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/workers/cli.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if TYPE_CHECKING",
]
