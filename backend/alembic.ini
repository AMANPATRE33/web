[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# The URL is injected from app settings by alembic/env.py. It is listed here
# only so that `alembic` tooling can locate the config; it is never read as a
# source of truth, so no credential lives in this file.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Intentionally empty. Alembic's `console_scripts` hook type resolves entry
# points from installed distributions, which fails on Windows and inside some
# CI runners. Run the formatter explicitly instead:
#     python -m ruff format alembic/versions
#     python -m ruff check  --fix alembic/versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
